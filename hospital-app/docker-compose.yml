version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: hospital-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: HospitalDB
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: hospital-backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: HospitalDB
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hospital-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
